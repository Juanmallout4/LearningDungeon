<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Sabes más que la maestra?</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 60px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            color: #4caf50;
        }

        .level-badge {
            background: #f44336;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 10px;
            display: inline-block;
            box-shadow: 0 0 15px rgba(244, 67, 54, 0.5);
        }

        .health-container {
            width: 80%;
            height: 50px;
            background: #2a2a2a;
            border: 3px solid #444;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            margin: 30px 0;
        }

        .health-bar {
            height: 100%;
            background: linear-gradient(90deg, #2e7d32, #4caf50);
            width: 100%;
            transition: width 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .health-text {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.8rem;
            text-shadow: 2px 2px 4px #000;
        }

        .boss-container {
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #bossImage {
            max-height: 100%;
            max-width: 100%;
            filter: drop-shadow(0 0 30px rgba(76, 175, 80, 0.4));
            transition: transform 0.1s;
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }

        .hit-anim {
            animation: shake 0.4s;
        }

        .qr-section {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(76, 175, 80, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .admin-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .admin-btn {
            background: rgba(0, 0, 0, 0.6);
            color: #888;
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .admin-btn:hover {
            background: #2e7d32;
            color: white;
            border-color: #4caf50;
        }

        .company-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
        }

        .company-logo img {
            height: 80px;
            margin-right: 15px;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }

        .slogan {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffca28;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 1);
            transition: opacity 1s ease-in-out;
        }

        .qr-section p {
            margin: 0 0 10px 0;
            font-weight: bold;
            font-size: 1rem;
            color: #4caf50;
        }

        #qrcode {
            background: white;
            padding: 10px;
            border-radius: 10px;
        }

        /* Ranking Overlay */
        #rankingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ranking-card {
            background: #1a1a1a;
            border: 2px solid #4caf50;
            border-radius: 20px;
            padding: 40px;
            width: 80%;
            max-width: 800px;
            box-shadow: 0 0 50px rgba(76, 175, 80, 0.3);
        }

        .ranking-title {
            font-size: 3rem;
            color: #4caf50;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.5rem;
        }

        th {
            text-align: left;
            border-bottom: 2px solid #333;
            padding: 15px;
            color: #888;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #222;
        }

        .top-scorer {
            color: #ffca28;
            font-weight: bold;
        }

        .hit-popup {
            position: absolute;
            color: #ff5252;
            font-weight: bold;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1s forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-100px);
                opacity: 0;
            }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="company-logo">
        <img src="https://i.postimg.cc/Vst0Zf0h/Aim-Education-Logo-Apps.png" alt="AIM Education">
        <div class="slogan" id="sloganText">¡Gamifica tu aula!</div>
    </div>

    <div class="admin-controls">
        <button class="admin-btn" onclick="reviveBoss()">Revivir Maestra</button>
    </div>

    <div class="container">
        <div class="header">
            <h1 id="bossName">¿Sabes más que la maestra?</h1>
            <div class="level-badge" id="levelText" style="background: #2e7d32; box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);">NIVEL 1</div>
        </div>

        <div class="health-container">
            <div class="health-bar" id="healthBar"></div>
            <div class="health-text"><span id="hpText">0 / 0</span></div>
        </div>

        <div class="boss-container" id="bossContainer">
            <img id="bossImage" src="" alt="Boss">
        </div>
    </div>

    <div class="qr-section">
        <p>¡ESCANEA PARA EVALUARTE!</p>
        <div id="qrcode"></div>
    </div>

    <div id="rankingOverlay">
        <div class="ranking-card">
            <h2 class="ranking-title">RANKING DE COMBATE</h2>
            <table id="rankingTable">
                <thead>
                    <tr>
                        <th>ÁRBITRO</th>
                        <th>DAÑO INFLIGIDO</th>
                        <th>MUERTES</th>
                    </tr>
                </thead>
                <tbody id="rankingBody">
                </tbody>
            </table>
            <p style="text-align: center; margin-top: 30px; color: #888;">El Boss reaparecerá más fuerte en unos
                segundos...</p>
        </div>
    </div>

    <script>
        const socket = io();
        let currentBoss = null;

        // QR Code pointing to mobile view
        const mobileUrl = window.location.origin + '/arbitraje/mobile';
        new QRCode(document.getElementById("qrcode"), {
            text: mobileUrl,
            width: 150,
            height: 150,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        socket.emit('arb_tv_join');

        socket.on('arb_state_update', (data) => {
            currentBoss = data.boss;
            document.getElementById('rankingOverlay').style.display = 'none';
            updateUI();
        });

        socket.on('arb_boss_hit', (data) => {
            if (!currentBoss) return;
            
            // Actualizar vida (usamos el valor absoluto del servidor)
            currentBoss.hp = data.newHp;
            updateHPUI();
            
            // Visual feedback (esto se ejecuta siempre para mostrar el golpe)
            const img = document.getElementById('bossImage');
            img.classList.remove('hit-anim');
            void img.offsetWidth;
            img.classList.add('hit-anim');

            showHitPopup(data.damage, data.playerName);
        });

        socket.on('arb_boss_defeated', (data) => {
            const overlay = document.getElementById('rankingOverlay');
            const tbody = document.getElementById('rankingBody');
            tbody.innerHTML = '';

            data.ranking.forEach((p, index) => {
                const row = document.createElement('tr');
                if (index === 0) row.className = 'top-scorer';
                row.innerHTML = `
                    <td>${p.name}</td>
                    <td>${p.damage}</td>
                    <td>${p.deaths}</td>
                `;
                tbody.appendChild(row);
            });

            overlay.style.display = 'flex';
        });

        function updateUI() {
            if (!currentBoss) return;
            document.getElementById('bossName').textContent = "Maestra Ana María";
            document.getElementById('levelText').textContent = `NIVEL ${currentBoss.level}${currentBoss.level > 1 ? ' (x' + Math.pow(2, currentBoss.level - 1) + ' Vida)' : ''}`;
            document.getElementById('bossImage').src = "https://i.postimg.cc/GmsLL3mZ/Sin-titulo.png";
            updateHPUI();
        }

        function updateHPUI() {
            if (!currentBoss) return;
            const pct = (currentBoss.hp / currentBoss.totalHp) * 100;
            document.getElementById('healthBar').style.width = `${pct}%`;
            document.getElementById('hpText').textContent = `${Math.ceil(currentBoss.hp)} / ${currentBoss.totalHp}`;
        }

        function reviveBoss() {
            socket.emit('arb_revive_boss');
        }

        function showHitPopup(damage, name) {
            const popup = document.createElement('div');
            popup.className = 'hit-popup';
            popup.textContent = `-${damage} (${name})`;

            const container = document.getElementById('bossContainer');
            const rect = container.getBoundingClientRect();

            popup.style.left = (Math.random() * 60 + 20) + '%';
            popup.style.top = (Math.random() * 40 + 30) + '%';

            container.appendChild(popup);
            setTimeout(() => popup.remove(), 1000);
        }

        // Slogan rotation
        const slogans = [
            "¡Gamifica tu aula!",
            "Aprende jugando...",
            "¿Quieres más información?"
        ];
        let currentSlogan = 0;
        setInterval(() => {
            const el = document.getElementById('sloganText');
            el.style.opacity = 0;
            setTimeout(() => {
                currentSlogan = (currentSlogan + 1) % slogans.length;
                el.textContent = slogans[currentSlogan];
                el.style.opacity = 1;
            }, 1000);
        }, 5000);
    </script>
</body>

</html>
